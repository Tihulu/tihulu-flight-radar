# Only these exact service operations may run without another password.
Cmnd_Alias TIHULU_FLIGHT_RADAR = /usr/bin/systemctl start readsb.service tar1090.service, \
    /usr/bin/systemctl stop readsb.service tar1090.service, \
    /usr/bin/systemctl enable readsb.service tar1090.service, \
    /usr/bin/systemctl disable readsb.service tar1090.service
%sudo ALL=(root) NOPASSWD: TIHULU_FLIGHT_RADAR
