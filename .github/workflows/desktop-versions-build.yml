name: Desktop version builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Attach artifacts to a GitHub Release (draft)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu-x64
            os: ubuntu-24.04
            artifact: linux-x64
          - label: windows-x64
            os: windows-latest
            artifact: win-x64
          - label: macos-arm64
            os: macos-latest
            artifact: macos-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check "PySide6==6.12.0" "PySide6-Addons==6.12.0" "PySide6-Essentials==6.12.0" "PySide6-WebEngine==6.12.0.140" pyinstaller
      - name: Build desktop executable (PyInstaller onedir)
        shell: bash
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name TihuluFlightRadar --collect-data tihulu_flight_radar --paths . tihulu_flight_radar/launcher.py
      - name: Package Linux (.deb + AppImage)
        if: matrix.label == 'ubuntu-x64'
        shell: bash
        run: |
          sh packaging/linux/build-deb.sh
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          cp -a dist/TihuluFlightRadar/. AppDir/usr/bin/
          install -m 0644 packaging/linux/tihulu-flight-radar.desktop AppDir/tihulu-flight-radar.desktop
          install -m 0644 packaging/linux/tihulu-flight-radar.svg AppDir/tihulu-flight-radar.svg
          install -m 0644 packaging/linux/tihulu-flight-radar.svg AppDir/usr/share/icons/hicolor/scalable/apps/tihulu-flight-radar.svg
          printf '#!/bin/sh\nexec "$(dirname "$0")/usr/bin/TihuluFlightRadar" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          curl -sSLo appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --no-appstream AppDir Tihulu_Flight_Radar-x86_64.AppImage
      - name: Package Windows zip
        if: matrix.label == 'windows-x64'
        shell: bash
        run: |
          cd dist && 7z a ../TihuluFlightRadar-win-x64.zip TihuluFlightRadar && cd ..
      - name: Package macOS zip
        if: matrix.label == 'macos-arm64'
        shell: bash
        run: |
          cd dist && ditto -c -k --sequesterRsrc --keepParent TihuluFlightRadar.app ../TihuluFlightRadar-macos-arm64.zip && cd ..
      - name: Collect artifacts and checksums
        shell: bash
        run: |
          mkdir -p dist-publish
          for f in Tihulu_Flight_Radar-x86_64.AppImage tihulu-flight-radar_0.3.2.dev4_amd64.deb TihuluFlightRadar-win-x64.zip TihuluFlightRadar-macos-arm64.zip; do
            for d in dist . ; do [ -f "$d/$f" ] && cp "$d/$f" dist-publish/ && break; done
          done
          cd dist-publish && sha256sum * > SHA256SUMS && ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: tihulu-flight-radar-${{ matrix.artifact }}
          path: dist-publish/
          if-no-files-found: error
          retention-days: 30

  build-arm64:
    name: linux-arm64 (Pi 5, QEMU)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build ARM64 PyInstaller dir, .deb and AppDir in aarch64 container (QEMU, no cross-compile)
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: aarch64
          distro: ubuntu24.04
          install: |
            apt-get update -q -y
            apt-get install -q -y --no-install-recommends python3 python3-pip python3-venv curl file binutils libpython3.12 libpython3.12-dev patchelf
          run: |
            set -e
            python3 -m venv .venv-arm
            . .venv-arm/bin/activate
            python -m pip install --disable-pip-version-check --upgrade pip
            python -m pip install --disable-pip-version-check "PySide6==6.12.0" "PySide6-Addons==6.12.0" "PySide6-Essentials==6.12.0" "PySide6-WebEngine==6.12.0.140" pyinstaller
            python -m PyInstaller --noconfirm --clean --windowed --onedir --name TihuluFlightRadar --collect-data tihulu_flight_radar --paths . tihulu_flight_radar/launcher.py
            DEB_ARCH=arm64 sh packaging/linux/build-deb.sh
            mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
            cp -a dist/TihuluFlightRadar/. AppDir/usr/bin/
            install -m 0644 packaging/linux/tihulu-flight-radar.desktop AppDir/tihulu-flight-radar.desktop
            install -m 0644 packaging/linux/tihulu-flight-radar.svg AppDir/tihulu-flight-radar.svg
            install -m 0644 packaging/linux/tihulu-flight-radar.svg AppDir/usr/share/icons/hicolor/scalable/apps/tihulu-flight-radar.svg
            printf '#!/bin/sh\nexec "$(dirname "$0")/usr/bin/TihuluFlightRadar" "$@"\n' > AppDir/AppRun
            chmod +x AppDir/AppRun
      - name: Assemble aarch64 AppImage on the host (no emulation needed)
        shell: bash
        run: |
          set -e
          curl -sSLf -o runtime-aarch64 "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-aarch64"
          file runtime-aarch64
          mksquashfs AppDir payload.squashfs -root-owned -noappend -quiet
          cat runtime-aarch64 payload.squashfs > Tihulu_Flight_Radar-aarch64.AppImage
          chmod +x Tihulu_Flight_Radar-aarch64.AppImage
          ls -la Tihulu_Flight_Radar-aarch64.AppImage
      - name: Collect artifacts and checksums
        shell: bash
        run: |
          mkdir -p dist-publish
          for f in Tihulu_Flight_Radar-aarch64.AppImage tihulu-flight-radar_0.3.2.dev4_arm64.deb; do
            for d in . dist ; do [ -f "$d/$f" ] && cp "$d/$f" dist-publish/ && break; done
          done
          (cd dist-publish && sha256sum * > SHA256SUMS && ls -la)

      - name: Verify ARM64 artifact structure (host-side, no emulation)
        shell: bash
        run: |
          set -e
          dpkg-deb -I dist-publish/tihulu-flight-radar_0.3.2.dev4_arm64.deb control | grep -q "Architecture: arm64"
          dpkg-deb -c dist-publish/tihulu-flight-radar_0.3.2.dev4_arm64.deb | grep -q "./opt/tihulu-flight-radar/"
          rm -rf /tmp/debx && mkdir -p /tmp/debx
          dpkg-deb -x dist-publish/tihulu-flight-radar_0.3.2.dev4_arm64.deb /tmp/debx
          file /tmp/debx/opt/tihulu-flight-radar/TihuluFlightRadar/TihuluFlightRadar | grep -q "ARM aarch64"
          file dist-publish/Tihulu_Flight_Radar-aarch64.AppImage | grep -q "ARM aarch64"
          python3 - <<'PY'
          data = open("dist-publish/Tihulu_Flight_Radar-aarch64.AppImage", "rb").read()
          assert data[:4] == b"\x7fELF", "AppImage does not start with an ELF runtime"
          off = data.find(b"hsqs")
          assert off > 0, "no squashfs payload found in AppImage"
          print(f"AppImage OK: runtime {off} B + payload {len(data) - off} B")
          PY
          echo "ARM64 structure verification PASSED"
      - uses: actions/upload-artifact@v4
        with:
          name: tihulu-flight-radar-linux-arm64
          path: dist-publish/
          if-no-files-found: error
          retention-days: 30

  arm64-smoke-test:
    name: arm64 smoke test (QEMU, installs the published .deb)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: build-arm64
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tihulu-flight-radar-linux-arm64
          path: arm64-artifacts
      - name: Install and launch the ARM64 .deb inside an aarch64 container (QEMU)
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: aarch64
          distro: ubuntu24.04
          install: |
            apt-get update -q -y
            apt-get install -q -y --no-install-recommends ca-certificates
          run: |
            set -e
            apt-get install -q -y "$PWD/arm64-artifacts/tihulu-flight-radar_0.3.2.dev4_arm64.deb" || apt-get install -q -y -f
            dpkg -l tihulu-flight-radar | grep -q "^ii"
            test -x /usr/bin/tihulu-flight-radar
            set +e
            timeout 120 env QT_QPA_PLATFORM=offscreen HOME=/root tihulu-flight-radar > /tmp/smoke.log 2>&1
            code=$?
            set -e
            echo "launch exit code: $code (124 = still running at timeout, acceptable)"
            tail -50 /tmp/smoke.log
            if grep -Eiq "ImportError|cannot open shared object|symbol lookup error|error while loading shared libraries" /tmp/smoke.log; then
              echo "::error::fatal library/import error during the ARM64 launch"
              exit 1
            fi
            if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
              echo "::error::ARM64 app exited with unexpected code $code"
              exit 1
            fi
            echo "ARM64 smoke test PASSED (structural install + launch, no fatal library errors)"

  release:
    name: Draft release
    needs: [build, build-arm64, arm64-smoke-test]
    if: inputs.publish_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create draft release with desktop builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f artifacts/SHA256SUMS
          (cd artifacts && sha256sum * > SHA256SUMS)
          tag="desktop-0.3.2.dev4-$(date +%Y%m%d-%H%M)"
          gh release create "$tag" --draft --title "Desktop builds 0.3.2.dev4 ($tag)" --notes "CI-built desktop artifacts from main. Not a signed or approved public release; verify SHA256SUMS before use."
          for f in artifacts/*; do gh release upload "$tag" "$f"; done
