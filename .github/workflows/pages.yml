name: Publish Flight Radar GitHub Pages
on:
  push:
    branches: [feature/github-pages-local-bridge-2026-11-06]
    paths:
      - "tihulu_flight_radar/web/**"
      - ".github/workflows/pages.yml"
      - "AGENTS.md"
      - "scripts/build-web-tar1090.sh"
      - "scripts/build-browser-assets.sh"
  pull_request:
    branches: [main]
    paths:
      - "tihulu_flight_radar/web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Two URLs, one source: this repo's browser source is mirrored by the
# TIHULU-TEXT-CENTER sync workflow to /flight_radar/.
# Pages must be enabled once at Settings -> Pages -> Source: Deploy from branch gh-pages / (root).
concurrency:
  group: tihulu-flight-radar-standalone-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  web-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build pinned same-origin WebUSB driver (CI only)
        run: bash scripts/build-browser-assets.sh
      - name: Bundle complete original tar1090 browser frontend
        run: bash scripts/build-web-tar1090.sh
      - name: Validate standalone app JavaScript and static assets
        run: |
          test -s tihulu_flight_radar/web/index.html
          test -s tihulu_flight_radar/web/style.css
          node --check tihulu_flight_radar/web/app.js
          node --check tihulu_flight_radar/web/sw.js
          node --check tihulu_flight_radar/web/browser_usb.mjs
          node --check tihulu_flight_radar/web/adsb_worker.mjs
          node --check tihulu_flight_radar/web/usb_tools.mjs
          node --check tihulu_flight_radar/web/tar1090-adapter.js
          node --check tihulu_flight_radar/web/tar1090/tihulu-browser-bridge.js
          test -s tihulu_flight_radar/web/tar1090/index.html
          test -s tihulu_flight_radar/web/tar1090/UPSTREAM-GPL-LICENSE.txt
          bash -n scripts/rtl-sdr-usb-interface.sh
          node --check deploy/cloudflare-worker.mjs
          node --test tests/web_bridge.test.cjs tests/pages_tar.test.cjs tests/browser_adsb.test.cjs tests/browser_source.test.cjs tests/aircraft_visuals.test.cjs tests/webusb_sampleblock.test.cjs tests/internet_sources.test.cjs tests/tar_full_browser.test.cjs
          python3 -m json.tool tihulu_flight_radar/web/manifest.webmanifest >/dev/null
          test -s tihulu_flight_radar/web/icon.svg
          test -s tihulu_flight_radar/web/sw.js
          test -s tihulu_flight_radar/web/browser_usb.mjs
          test -s tihulu_flight_radar/web/adsb_worker.mjs
          test -s tihulu_flight_radar/web/usb_tools.mjs
          test -s tihulu_flight_radar/web/vendor/rtlsdr.mjs
          test -s tihulu_flight_radar/web/vendor/RTLSDR-LICENSE.txt
          grep -q 'app.js' tihulu_flight_radar/web/index.html
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/feature/github-pages-local-bridge-2026-11-06'
    needs: web-check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: flight-radar-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build pinned browser WebUSB assets for deployment
        run: bash scripts/build-browser-assets.sh
      - name: Bundle complete tar1090 browser UI for deployment
        run: bash scripts/build-web-tar1090.sh
      - name: Record the exact browser source revision
        run: |
          printf '{"repo":"Tihulu/tihulu-flight-radar","source_ref":"%s","source_sha":"%s"}\n' \
            "$GITHUB_REF_NAME" "$GITHUB_SHA" > tihulu_flight_radar/web/source-revision.json
          printf '%s\n' 'https://tihulu.github.io/tihulu-flight-radar/' > "$RUNNER_TEMP/standalone-url.txt"
      - name: Checkout standalone Pages publishing branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
      - name: Publish exactly the source browser build at branch root
        run: |
          set -euo pipefail
          rsync -a --delete --exclude=.git tihulu_flight_radar/web/ pages/
          touch pages/.nojekyll
          test -s pages/index.html
          test -s pages/tar1090/index.html
          test -s pages/vendor/rtlsdr.mjs
          test -s pages/source-revision.json
          git -C pages config user.name 'github-actions[bot]'
          git -C pages config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C pages add -A
          if ! git -C pages diff --cached --quiet; then
            git -C pages commit -m "publish: standalone Flight Radar same browser source"
            git -C pages push origin HEAD:gh-pages
          fi
          echo "Target: https://tihulu.github.io/tihulu-flight-radar/"
          echo "If still 404, enable Settings → Pages → Deploy from branch gh-pages / (root)."

