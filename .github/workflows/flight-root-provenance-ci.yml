name: Flight PR42 independently pinned trust-root and provenance CI

on:
  push:
    branches:
      - prototype/flight-pr42-root-provenance-20261113
  pull_request:
    paths:
      - 'tools/flight_root_provenance_ci.py'
      - 'tools/flight_root_provenance_ci_tests.py'
      - '.github/workflows/flight-root-provenance-ci.yml'
      - 'docs/FLIGHT_PR42_ROOT_PROVENANCE_BOOTSTRAP.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trust_root_provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: 'true'
      GITHUB_ACTIONS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CI-only Ed25519 verification wheel
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: 'cryptography==46.0.3'
      - name: Compile isolated authority verifier and tests
        run: |
          python -m py_compile tools/flight_root_provenance_ci.py tools/flight_root_provenance_ci_tests.py
      - name: Root bootstrap, signer authority, revocation, rotation and provenance negative fixtures
        run: |
          python -m tools.flight_root_provenance_ci_tests
      - name: Check that hosted fixture did not edit tracked source
        run: git diff --exit-code
