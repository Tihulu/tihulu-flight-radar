name: Flight PR32 P1-P2 fail-closed acceptance (disposable)

on:
  pull_request:
    paths:
      - 'tools/flight_pr31_independent_security_qa.py'
      - '.github/workflows/flight-pr31-independent-security-qa.yml'
      - 'tools/flight_transaction_lab.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-adversarial:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: 'true'
      GITHUB_ACTIONS: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Compile test and code; no hardware or installation permitted
        run: |
          python -m py_compile tools/flight_transaction_lab.py tools/flight_pr31_independent_security_qa.py
          test -f tools/flight_pr31_independent_security_qa.py
      - name: Validate namespace-fail-closed, lock nonoverlap, evidence cap and external digest pins
        run: python -m tools.flight_pr31_independent_security_qa
      - name: Ensure repository files were not modified
        run: git diff --exit-code
