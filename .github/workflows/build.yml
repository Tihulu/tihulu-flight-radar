name: Cross-platform CI and preview builds

on:
  push:
    branches: ["feature/**", "main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux-x64
          - os: windows-2025
            label: windows-x64
          - os: macos-15
            label: macos-apple-silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install app and build tools
        run: python -m pip install -e ".[test,build]"
      - name: Verify runner architecture
        if: matrix.label == 'macos-apple-silicon'
        shell: bash
        run: test "$(uname -m)" = arm64
      - name: Run unit tests
        run: python -m pytest -q
      - name: Validate Linux installer syntax
        if: matrix.label == 'linux-x64'
        run: bash -n scripts/install-linux.sh
      - name: Verify map autofocus / nearest-aircraft logic
        run: node --test tests/map_focus.test.cjs tests/map_html.test.cjs tests/web_bridge.test.cjs tests/pages_tar.test.cjs
      - name: Install Linux Qt runtime dependencies
        if: matrix.label == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libnss3 libnspr4 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libxtst6
      - name: Verify embedded native desktop entrypoint
        run: python -c "from tihulu_flight_radar.native import NativeRadarWindow; print(NativeRadarWindow.__name__)"
      - name: Smoke-test Qt desktop window
        if: matrix.label == 'linux-x64'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/qt_smoke.py
      - name: Compile Python
        run: python -m compileall -q tihulu_flight_radar
      - name: Build desktop executable
        shell: bash
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name TihuluFlightRadar --collect-data tihulu_flight_radar --paths . tihulu_flight_radar/launcher.py
      - name: Upload preview build
        uses: actions/upload-artifact@v4
        with:
          name: tihulu-flight-radar-${{ matrix.label }}
          path: |
            dist/TihuluFlightRadar/
            dist/TihuluFlightRadar.app/
          if-no-files-found: error
          retention-days: 14

  debian:
    name: Debian 12 x64 source compatibility and preview
    runs-on: ubuntu-24.04
    container: debian:12
    steps:
      - name: Install Debian build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates python3 python3-venv python3-pip libpython3.11 build-essential patchelf libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libglib2.0-0 libfontconfig1 libx11-6 libxcb-cursor0 libsm6 libice6 libnss3 libnspr4 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libxtst6
      - uses: actions/checkout@v4
      - name: Install app and test tools
        run: |
          python3 -m venv /opt/tihulu-venv
          /opt/tihulu-venv/bin/pip install -e ".[test,build]"
      - name: Run unit tests
        run: /opt/tihulu-venv/bin/python -m pytest -q
      - name: Validate Linux installer syntax
        run: bash -n scripts/install-linux.sh
      - name: Smoke-test Qt desktop window
        env:
          QT_QPA_PLATFORM: offscreen
        run: /opt/tihulu-venv/bin/python scripts/qt_smoke.py
      - name: Verify embedded native desktop entrypoint
        run: /opt/tihulu-venv/bin/python -c "from tihulu_flight_radar.native import NativeRadarWindow; print(NativeRadarWindow.__name__)"
      - name: Compile Python
        run: /opt/tihulu-venv/bin/python -m compileall -q tihulu_flight_radar
      - name: Build Debian-compatible preview
        run: /opt/tihulu-venv/bin/python -m PyInstaller --noconfirm --clean --windowed --onedir --name TihuluFlightRadar --collect-data tihulu_flight_radar --paths . tihulu_flight_radar/launcher.py
      - name: Package Debian .deb
        run: sh packaging/linux/build-deb.sh
      - name: Upload Debian preview
        uses: actions/upload-artifact@v4
        with:
          name: tihulu-flight-radar-debian12-x64
          path: |
            dist/TihuluFlightRadar/
            dist/tihulu-flight-radar_0.3.1_amd64.deb
          if-no-files-found: error
          retention-days: 14
