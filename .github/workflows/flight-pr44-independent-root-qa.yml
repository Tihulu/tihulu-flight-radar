name: Agent 06 independent PR44 root rotation and provenance QA

on:
  push:
    branches:
      - audit/flight-pr44-independent-root-qa-20261113
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent_pr44_policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CI: 'true'
      GITHUB_ACTIONS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CI-only Ed25519 verifier
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: 'cryptography==46.0.3'
      - name: Compile frozen root/provenance engine and independently adapted P2 attacks
        run: |
          python -m py_compile tools/flight_p1_root_provenance_ci.py tools/flight_pr44_independent_root_qa.py
      - name: Run strict independent P2-F43-01/02 and root provenance attacks
        run: |
          python -m tools.flight_pr44_independent_root_qa
      - name: Preserve pre-existing 34 root/provenance functional tests
        run: |
          python -m tools.flight_p1_root_provenance_ci_tests
      - name: Preserve independently authored prior 18 FD and metadata attacks
        run: |
          python -m tools.flight_pr41_independent_security_qa
      - name: Check disposable CI left tracked repository files intact
        run: git diff --exit-code
