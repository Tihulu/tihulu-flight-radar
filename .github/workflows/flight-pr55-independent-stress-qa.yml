name: Independent PR55 multi-UID stress QA

on:
  push:
    branches:
      - audit/flight-pr55-independent-stress-qa-20261120
  pull_request:
    paths:
      - 'tools/flight_pr55_independent_stress_qa.py'
      - '.github/workflows/flight-pr55-independent-stress-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable_linux_root_uid_stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      CI: 'true'
      GITHUB_ACTIONS: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact QA head without persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout FROZEN independent PR54 positive witnesses at immutable SHA in a separate directory
        uses: actions/checkout@v4
        with:
          ref: ce13e5d6ce3c33ead3e665c2143cfff4dcb821a9
          path: frozen-pr54
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned disposable-only signature verifier
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: 'cryptography==46.0.3'
      - name: Compile QA-only stress suite
        run: |
          python -m py_compile tools/flight_pr55_independent_stress_qa.py tools/flight_p1_broker_pr52_remediation_ci.py
      - name: Independent multi-UID stress evidence (slow/half-send, fd bursts, post-commit death, storms, second recipient, PID reuse, restart replay, availability and clock limits)
        run: |
          sudo --non-interactive env CI=true GITHUB_ACTIONS=true RUNNER_TEMP="$RUNNER_TEMP" PYTHONPATH="$GITHUB_WORKSPACE" PYTHONDONTWRITEBYTECODE=1 "$(command -v python)" -m tools.flight_pr55_independent_stress_qa
      - name: Preserved predecessor acceptance suites on this QA head
        run: |
          sudo --non-interactive env CI=true GITHUB_ACTIONS=true RUNNER_TEMP="$RUNNER_TEMP" PYTHONPATH="$GITHUB_WORKSPACE" PYTHONDONTWRITEBYTECODE=1 "$(command -v python)" -m tools.flight_p1_broker_pr52_remediation_tests
          sudo --non-interactive env CI=true GITHUB_ACTIONS=true RUNNER_TEMP="$RUNNER_TEMP" PYTHONPATH="$GITHUB_WORKSPACE" PYTHONDONTWRITEBYTECODE=1 "$(command -v python)" -m tools.flight_pr51_independent_os_broker_qa
          sudo --non-interactive env CI=true GITHUB_ACTIONS=true RUNNER_TEMP="$RUNNER_TEMP" PYTHONPATH="$GITHUB_WORKSPACE" PYTHONDONTWRITEBYTECODE=1 "$(command -v python)" -m tools.flight_p1_broker_os_boundary_tests
          python -m tools.flight_pr47_independent_broker_qa
          python -m tools.flight_p1_broker_ci_tests
          python -m tools.flight_pr41_independent_security_qa
      - name: Preserve QA PR54 exact original 28-case POSITIVE vulnerability evidence on FROZEN SHA only
        run: |
          cd frozen-pr54
          sudo --non-interactive env CI=true GITHUB_ACTIONS=true RUNNER_TEMP="$RUNNER_TEMP" PYTHONPATH="$PWD" PYTHONDONTWRITEBYTECODE=1 "$(command -v python)" -m tools.flight_pr53_independent_security_qa
      - name: Ensure QA source files not modified by CI
        run: git diff --exit-code
