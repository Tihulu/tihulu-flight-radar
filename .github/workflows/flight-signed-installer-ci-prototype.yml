name: Flight signed artifact trust and sealed-FD CI prototype

on:
  pull_request:
    paths:
      - 'tools/flight_signed_installer_ci_prototype.py'
      - 'tools/flight_signed_installer_ci_tests.py'
      - '.github/workflows/flight-signed-installer-ci-prototype.yml'
      - 'docs/FLIGHT_SIGNED_INSTALLER_CI_PROTOTYPE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-fixture-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: 'true'
      GITHUB_ACTIONS: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Select hosted Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ONLY CI verifier dependency (binary wheel)
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: 'cryptography==46.0.3'
      - name: Compile dedicated fixture-only files
        run: |
          python -m py_compile tools/flight_signed_installer_ci_prototype.py tools/flight_signed_installer_ci_tests.py
      - name: Signed metadata, foreign-byte swap and sealed-FD adversarial tests
        run: python -m tools.flight_signed_installer_ci_tests
      - name: Verify no tracked source changed in disposable runner
        run: git diff --exit-code
