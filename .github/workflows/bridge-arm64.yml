name: Raspberry Pi ARM64 bridge compatibility preview
on:
  push:
    branches: ["feature/**", main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight bridge without Qt desktop dependencies
        run: python -m pip install --no-deps .
      - name: Verify ARM64 runtime
        run: test "$(uname -m)" = aarch64
      - name: Smoke-test bridge CLI
        run: tihulu-flight-bridge --help
      - name: Bridge unit tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_bridge.py tests/test_multi_sources.py tests/test_tar_static_internet_only.py tests/test_version_switch.py
      - name: Build Raspberry Pi bridge source distribution
        run: |
          tar -czf tihulu-flight-radar-pi-arm64-source.tar.gz \
            pyproject.toml README.md tihulu_flight_radar scripts
      - uses: actions/upload-artifact@v4
        with:
          name: tihulu-flight-radar-pi-arm64-bridge-source
          path: tihulu-flight-radar-pi-arm64-source.tar.gz
          retention-days: 14
