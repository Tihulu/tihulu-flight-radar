name: Agent 06 Flight PR37 independent signed byte QA

on:
  push:
    branches:
      - audit/flight-pr37-independent-signed-qa-20261113
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent_signed_fd:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: 'true'
      GITHUB_ACTIONS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CI verifier
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: 'cryptography==46.0.3'
      - name: Compile isolated tests
        run: |
          python -m py_compile tools/flight_pr37_independent_security_qa.py tools/flight_signed_installer_ci_prototype.py
      - name: Run independent adversarial tests
        run: |
          python -m tools.flight_pr37_independent_security_qa
      - name: Verify immutable checkout
        run: git diff --exit-code
