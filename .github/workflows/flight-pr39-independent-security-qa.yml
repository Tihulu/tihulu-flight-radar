name: Flight PR40 API/FD ownership fail-closed acceptance

on:
  push:
    branches:
      - audit/flight-pr39-independent-qa-20261113
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata_fd_qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: 'true'
      GITHUB_ACTIONS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CI-only cryptographic verifier dependency
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: 'cryptography==46.0.3'
      - name: Compile isolated QA and exact PR39 prototype
        run: |
          python -m py_compile tools/flight_pr39_independent_security_qa.py tools/flight_signed_installer_ci_prototype.py
      - name: Audit-derived 17 negative controls and documented same-process limits
        run: |
          python -m tools.flight_pr39_independent_security_qa
      - name: Verify no tracked application files changed
        run: git diff --exit-code
