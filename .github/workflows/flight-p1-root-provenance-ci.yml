name: Flight P1 Root and Provenance CI-only trust prototype

on:
  push:
    branches:
      - prototype/flight-p1-root-provenance-20261113
  pull_request:
    paths:
      - 'tools/flight_p1_root_provenance_ci.py'
      - 'tools/flight_p1_root_provenance_ci_tests.py'
      - '.github/workflows/flight-p1-root-provenance-ci.yml'
      - 'docs/FLIGHT_P1_ROOT_PROVENANCE_PRODUCTION_TRUST.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic_root_provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CI: 'true'
      GITHUB_ACTIONS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CI verifier dependency (binary wheel only)
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: 'cryptography==46.0.3'
      - name: Syntax-check NEW policy engine and negative cases
        run: |
          python -m py_compile tools/flight_p1_root_provenance_ci.py tools/flight_p1_root_provenance_ci_tests.py
      - name: Root bootstrap, rotation, role-authority and provenance negative tests
        run: |
          python -m tools.flight_p1_root_provenance_ci_tests
      - name: Verify no tracked repository files mutated by tests
        run: git diff --exit-code
