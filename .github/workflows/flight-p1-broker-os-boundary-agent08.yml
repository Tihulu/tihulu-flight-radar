name: Agent08 Linux OS separated-UID broker P1 security acceptance

on:
  push:
    branches:
      - remediation/flight-p1-broker-os-boundary-agent08-20261113
  pull_request:
    paths:
      - 'tools/flight_p1_broker_os_boundary_ci.py'
      - 'tools/flight_p1_broker_os_boundary_tests.py'
      - 'docs/FLIGHT_P1_BROKER_OS_BOUNDARY_REMEDIATION.md'
      - '.github/workflows/flight-p1-broker-os-boundary-agent08.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  os_separated_uid_proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      GITHUB_ACTIONS: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact test head without retained credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned ephemeral test Ed25519 verification
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: 'cryptography==46.0.3'
      - name: Compile new isolated broker and signed root / old QA
        run: |
          python -m py_compile tools/flight_p1_broker_os_boundary_ci.py tools/flight_p1_broker_os_boundary_tests.py tools/flight_pr47_independent_broker_qa.py tools/flight_p1_broker_ci_tests.py tools/flight_pr41_independent_security_qa.py
      - name: Run real kernel UID separation / root-owned storage acceptance
        run: |
          # Ephemeral hosted runner ONLY: root privileges for this test process.
          # This does NOT install a broker or alter service/systemd/sudoers.
          sudo --non-interactive env CI=true GITHUB_ACTIONS=true RUNNER_TEMP="$RUNNER_TEMP" PYTHONPATH="$GITHUB_WORKSPACE" PYTHONDONTWRITEBYTECODE=1 "$(command -v python)" -m tools.flight_p1_broker_os_boundary_tests
      - name: Run frozen QA PR50 positive original P1 attack witnesses unchanged
        run: |
          python -m tools.flight_pr47_independent_broker_qa
      - name: Run frozen PR47 original same-UID CI model tests unchanged
        run: |
          python -m tools.flight_p1_broker_ci_tests
      - name: Run frozen PR42 18 security tests unchanged
        run: |
          python -m tools.flight_pr41_independent_security_qa
      - name: Guard tracked repo from CI test changes
        run: git diff --exit-code
