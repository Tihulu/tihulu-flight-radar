name: Flight PR34 after-validation race acceptance (disposable)

on:
  pull_request:
    paths:
      - 'tools/flight_pr33_independent_security_qa.py'
      - '.github/workflows/flight-pr33-independent-security-qa.yml'
      - 'tools/flight_transaction_lab.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-pr33-adversarial:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: 'true'
      GITHUB_ACTIONS: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Static compilation without touching user services
        run: python -m py_compile tools/flight_transaction_lab.py tools/flight_pr33_independent_security_qa.py
      - name: Execute independent adversarial negative controls and positive blocker reproductions
        run: python -m tools.flight_pr33_independent_security_qa
      - name: Check immutable repository checkout
        run: git diff --exit-code
