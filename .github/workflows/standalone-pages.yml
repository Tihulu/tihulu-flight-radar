name: Publish standalone Flight Radar GitHub Pages (canonical source)

on:
  workflow_dispatch:
  schedule:
    # Recovery publish in case a feature-branch push was skipped/delayed.
    - cron: '19 * * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/standalone-pages.yml
      - AGENTS.md

# Same output and source SHA as TEXT CENTER/flight_radar. Until draft PR #6
# merges, the maintained browser implementation is on the feature branch.
permissions:
  contents: read

concurrency:
  group: tihulu-flight-radar-standalone-pages
  cancel-in-progress: false

jobs:
  verify-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout canonical Flight Radar browser source
        uses: actions/checkout@v4
        with:
          repository: Tihulu/tihulu-flight-radar
          ref: feature/github-pages-local-bridge-2026-11-06
          path: flight
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify WebUSB browser application
        run: |
          set -euo pipefail
          cd flight
          bash scripts/build-browser-assets.sh
          node --check tihulu_flight_radar/web/app.js
          node --check tihulu_flight_radar/web/browser_usb.mjs
          node --check tihulu_flight_radar/web/adsb_worker.mjs
          node --check tihulu_flight_radar/web/sw.js
          node --test tests/web_bridge.test.cjs tests/pages_tar.test.cjs tests/browser_adsb.test.cjs tests/browser_source.test.cjs tests/aircraft_visuals.test.cjs tests/webusb_sampleblock.test.cjs tests/internet_sources.test.cjs
          test -s tihulu_flight_radar/web/vendor/rtlsdr.mjs
      - name: Stamp same browser source revision as TEXT CENTER
        run: |
          set -euo pipefail
          sha="$(git -C flight rev-parse HEAD)"
          printf '{"repo":"Tihulu/tihulu-flight-radar","source_ref":"feature/github-pages-local-bridge-2026-11-06","source_sha":"%s"}\n' "$sha" > flight/tihulu_flight_radar/web/source-revision.json
          echo "Canonical source: $sha"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: flight/tihulu_flight_radar/web
      - name: Deploy standalone Pages
        id: deploy
        uses: actions/deploy-pages@v4
